server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA - redirecționează toate rutele către index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
