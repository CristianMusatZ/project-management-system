name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ════════════════════════════════════════════════════
  # Job 1: Lint & Test Backend
  # ════════════════════════════════════════════════════
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test

  # ════════════════════════════════════════════════════
  # Job 2: Lint, Build & Test Frontend
  # ════════════════════════════════════════════════════
  frontend-test:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint || true

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

  # ════════════════════════════════════════════════════
  # Job 3: npm audit (dependency vulnerability check)
  # ════════════════════════════════════════════════════
  dependency-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Audit backend dependencies
        # Fail pe vulnerabilități HIGH sau CRITICAL
        run: cd backend && npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high || true

  # ════════════════════════════════════════════════════
  # Job 4: Snyk — SAST + SCA (Software Composition Analysis)
  # Necesită secret SNYK_TOKEN în GitHub → Settings → Secrets
  # Obținut gratuit de pe snyk.io (cont free disponibil)
  # Job-ul este SKIP-uit automat dacă SNYK_TOKEN nu e configurat.
  # ════════════════════════════════════════════════════
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk

      # Dacă SNYK_TOKEN nu e setat, scriptul iese cu 0 (skip curat)
      - name: Snyk — Scan backend (SCA + SAST)
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "⚠️  SNYK_TOKEN not configured — skipping Snyk scan."
            echo "   Add SNYK_TOKEN in GitHub → Settings → Secrets → Actions"
            exit 0
          fi
          cd backend
          snyk test --severity-threshold=high --json > ../snyk-backend.json || true
          snyk code test --json >> ../snyk-backend-code.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk — Scan frontend (SCA + SAST)
        run: |
          if [ -z "$SNYK_TOKEN" ]; then exit 0; fi
          cd frontend
          snyk test --severity-threshold=high --json > ../snyk-frontend.json || true
          snyk code test --json >> ../snyk-frontend-code.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-reports
          path: |
            snyk-backend.json
            snyk-backend-code.json
            snyk-frontend.json
            snyk-frontend-code.json
          retention-days: 30

  # ════════════════════════════════════════════════════
  # Job 5: CodeQL — Static Analysis Security Testing (SAST)
  # Rulează automat, rezultatele apar în GitHub Security → Code scanning
  # ════════════════════════════════════════════════════
  codeql-analysis:
    name: CodeQL — SAST Analysis
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      actions: read
      contents: read
      security-events: write   # necesar pentru a publica rezultatele SARIF

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Queries suplimentare: security-extended include pattern-uri mai stricte
          queries: security-extended,security-and-quality

      - name: Setup Node.js (necesar pentru autobuild)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (backend + frontend)
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ════════════════════════════════════════════════════
  # Job 6: Build Docker Images (doar pe main/master)
  # ════════════════════════════════════════════════════
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [dependency-audit, codeql-analysis]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t pms-backend:${{ github.sha }} --target production ./backend

      - name: Build frontend image
        run: docker build -t pms-frontend:${{ github.sha }} --target production ./frontend

      - name: Tag images as latest
        run: |
          docker tag pms-backend:${{ github.sha }} pms-backend:latest
          docker tag pms-frontend:${{ github.sha }} pms-frontend:latest

      # Pentru a publica pe un registry, decomentează și configurează secretele:
      # - REGISTRY_URL (ex: ghcr.io sau docker.io)
      # - REGISTRY_USERNAME
      # - REGISTRY_PASSWORD
