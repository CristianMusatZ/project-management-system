name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ============================
  # Job 1: Lint & Test Backend
  # ============================
  backend-test:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test

  # ============================
  # Job 2: Lint & Test Frontend
  # ============================
  frontend-test:
    name: Frontend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

  # ============================
  # Job 3: Security Scanning
  # ============================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high || true

  # ============================
  # Job 4: CodeQL Analysis
  # ============================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================
  # Job 5: Build Docker Images
  # ============================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pms-backend:${{ github.sha }} --target production ./backend

      - name: Build frontend image
        run: docker build -t pms-frontend:${{ github.sha }} --target production ./frontend

      - name: Tag images as latest
        run: |
          docker tag pms-backend:${{ github.sha }} pms-backend:latest
          docker tag pms-frontend:${{ github.sha }} pms-frontend:latest

      # TODO: Push to container registry (Docker Hub, GitHub Container Registry, etc.)
      # - name: Push to registry
      #   run: |
      #     docker push pms-backend:latest
      #     docker push pms-frontend:latest
